<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Project</title>
    <style>
        html, body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f8f8f8;
            overflow-x: hidden;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: white;
            color: black;
            position: relative;
        }

        header a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        header a:hover {
            color: #A7C7E7; /* Light blue hover effect */
        }

        .header-links {
            display: flex;
            gap: 20px;
        }

        /* Video Container */
     .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80%;
            max-width: 900px;
            height: 450px;
            margin: 0 auto;
            padding: 20px 0;
        }

        iframe {
            width: 88%;
            height: 99%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: block;
        }


        /* Description */
        .description {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.5;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Two columns */
            grid-template-rows: repeat(3, auto); /* Three rows */
            gap: 20px;
            padding: 20px;
            width: 80%;
            margin: 0 auto;
        }

        .photo-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        .photo-grid img:hover {
            transform: scale(1.02);
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            width: 100%;
            margin-top: auto;

        }

        footer a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        footer a:hover {
            color: #A7C7E7;
        }

        .menu-toggle {
            display: none;
            font-size: 2rem;
            cursor: pointer;
        }
        
        /* MOBILE STYLES */
        @media (max-width: 768px) {
            .video-container {
                height: auto;
            }
            
            iframe {
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
            }

            .header-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: 20px;
                background: white;
                padding: 15px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }
        
            .header-links a {
                margin: 10px 0;
            }
        
            .header-links.active {
                display: flex;
            }
        
            .menu-toggle {
                display: block;
            }
        
            /* Make images taller so page scrolls */
            .image-container img {
                height: 80vh;
                object-fit: cover;
            }
        
            .overlay-text {
                font-size: 1.5rem;
            }
        }

    </style>
</head>
<body>

<!-- Header -->
<header>
    <a href="index.html" class="logo">JONATHAN HOANG NGUYEN</a>

    <div class="menu-toggle" id="menu-toggle">
        ☰
    </div>

    <div class="header-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="videoprojects.html">Videography</a>
        <a href="mumbai-photo-collection.html">Mumbai Collection</a>
        <a href="thailand-photo-collection.html">Thailand Collection</a>
    </div>
</header>

<!-- Video Section -->
<div class="video-container">
    <iframe src="https://player.vimeo.com/video/1063667765#t=0s" frameborder="0" allowfullscreen></iframe>
</div>

<!-- Description -->
<div class="description">
    <h2>About This Project</h2>
    <p>Trailer for Festival de CAMMES, March 12th, 2025.</p>
</div>

<!-- Footer -->
<footer>
    <p>Let's be friends</p>
    <a href="https://www.instagram.com/jayna__win/" target="_blank">Instagram</a> |
    <a href="https://www.linkedin.com/in/jonathannguyens/" target="_blank">LinkedIn</a> |
    <a href="https://www.youtube.com/@jayna_win" target="_blank">YouTube</a>
</footer>

<script>
    const toggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    toggle.addEventListener("click", function() {
        navLinks.classList.toggle("active");
    });
</script>
    
</body>
</html>
