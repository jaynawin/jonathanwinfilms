<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f8f8f8;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: white;
            color: black;
            position: relative;
        }

        header a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        header a:hover {
            color: #A7C7E7;
        }

        .header-links {
            display: flex;
            gap: 20px;
        }

        .menu-toggle {
            display: none;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Video Section */
        .video-container {
            padding: 40px 20px; /* gives side breathing room on mobile */
        }

        iframe {
            width: 80%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: block;
            margin: 0 auto;
        }

        /* Description */
        .description {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.5;
        }

        /* Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            width: 80%;
            margin: 0 auto;
        }

        .photo-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        .photo-grid img:hover {
            transform: scale(1.02);
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            width: 100%;
            margin-top: 40px;
        }

        footer a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        footer a:hover {
            color: #A7C7E7;
        }

        /* MOBILE STYLES */
        @media (max-width: 768px) {

            /* Make video responsive but respect container padding */
            iframe {
                width: 100%;
            }

            /* Stack photo grid */
            .photo-grid {
                grid-template-columns: 1fr;
                width: 100%;
                padding: 15px;
            }

            .photo-grid img {
                height: auto;
                object-fit: contain;
            }

            /* Mobile nav */
            .header-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: 20px;
                background: white;
                padding: 15px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }

            .header-links a {
                margin: 10px 0;
            }

            .header-links.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }
        }

    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">JONATHAN HOANG NGUYEN</a>

    <div class="menu-toggle" id="menu-toggle">
        ☰
    </div>

    <div class="header-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="videoprojects.html">Videography</a>
        <a href="mumbai-photo-collection.html">Mumbai Collection</a>
        <a href="thailand-photo-collection.html">Thailand Collection</a>
    </div>
</header>

<div class="video-container">
    <iframe src="https://player.vimeo.com/video/1074155996#t=0s" allowfullscreen></iframe>
</div>

<div class="description">
    <h2>About This Project</h2>
    <p>Two voices drift across a dinner table where a longing unfolds in the space between them.</p>
</div>

<div class="photo-grid">
    <img src="interbleustill1.jpg" alt="Still from video" loading="lazy">
    <img src="interbleustill.jpg" alt="Still from video" loading="lazy">
</div>

<footer>
    <p>Let's be friends</p>
    <a href="https://www.instagram.com/jayna__win/" target="_blank">Instagram</a> |
    <a href="https://www.linkedin.com/in/jonathannguyens/" target="_blank">LinkedIn</a> |
    <a href="https://www.youtube.com/@jayna_win" target="_blank">YouTube</a>
</footer>

<script>
    const toggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    toggle.addEventListener("click", function() {
        navLinks.classList.toggle("active");
    });
</script>

</body>
</html>
