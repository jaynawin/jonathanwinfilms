<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Collection</title>
    <style>
        html, body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f8f8f8;
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: white;
            color: black;
        }

        header a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        header a:hover {
            color: #A7C7E7; /* Light blue hover effect */
        }

        .header-links {
            display: flex;
            gap: 20px;
        }

        /* Gallery Layout - Three Columns */
        .gallery {
            display: grid;
            grid-template-columns: 1fr 3fr 1fr; /* One column for left, one for center, one for right */
            gap: 20px;
            padding: 20px;
        }

        /* Left and Right Column (Vertical Photos) */
        .gallery img.left, .gallery img.right {
            width: 100%;
            height: 460px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        /* Center Column (Horizontal Photo) */
        .gallery img.center {
            width: 100%;
            height: 460px;
            object-fit: cover; /* Ensures the image fills the area without distortion */
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }
        
        /* New 2x2 Gallery Layout */
        .gallery-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .gallery-2x2 img {
            width: 100%;
            height: 460px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        .gallery-2x2 img:hover {
            transform: scale(1.02);
        }


        /* Updated Full-width Three-column Layout */
        .full-width-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Three equal columns */
            gap: 20px; /* Adds spacing between images */
            padding: 20px; /* Matches spacing of other galleries */
            width: calc(100vw - 40px); /* Adjusts for padding */
            margin: 0 auto; /* Centers the gallery */
        }
        
        /* Styling for full-width images */
        .full-width-gallery img {
            width: 100%;
            height: 800px; 
            object-fit: cover; /* Ensures images fill the area without distortion */
            border-radius: 8px; /* Matches rounded corners */
            transition: transform 0.3s ease-in-out; /* Adds hover effect */
        }
        
        .full-width-gallery img:hover {
            transform: scale(1.02); /* Same subtle zoom effect */
        }


        


        /* Footer Styles */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            left: 0;
            bottom: 0;
            width: 100%;
            margin-top: 20px; /* Adds spacing between content and footer */
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }

        footer ul {
            list-style-type: none;
            padding: 0;
        }

        footer ul li {
            display: inline;
            margin: 0 15px;
        }

        footer a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        footer a:hover {
            color: #A7C7E7;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensures the body takes full height of the viewport */
        }

        .content {
            flex: 1; /* Pushes the footer to the bottom */
        }

        .menu-toggle {
            display: none;
            font-size: 2rem;
            cursor: pointer;
        }
        
        /* MOBILE STYLES */
        @media (max-width: 768px) {
            /* Stack all galleries into one column */
            .gallery,
            .gallery-2x2,
            .full-width-gallery {
                grid-template-columns: 1fr;
            }
            
            /* Remove forced heights so images show naturally */
            .gallery img,
            .gallery-2x2 img,
            .full-width-gallery img {
                height: auto;
                width: 100%;
                object-fit: contain;
            }
        
            .header-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: 20px;
                background: white;
                padding: 15px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }
        
            .header-links a {
                margin: 10px 0;
            }
        
            .header-links.active {
                display: flex;
            }
        
            .menu-toggle {
                display: block;
            }
        
            /* Make images taller so page scrolls */
            .image-container img {
                height: 80vh;
                object-fit: cover;
            }
        
            .overlay-text {
                font-size: 1.5rem;
            }
        }
        /* Image Popup */
            .popup {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0,0,0,0.8);
            }
            
            .popup-content {
                background: white;
                max-width: 900px;
                width: 90%;
                margin: 5% auto;
                padding: 20px;
                border-radius: 10px;
                display: flex;
                gap: 20px;
                align-items: center;
            }
            
            .popup-content img {
                width: 50%;
                max-height: 70vh;
                object-fit: contain;
            }
            
            .popup-text {
                width: 50%;
                text-align: left;
            }
            
            .close {
                position: absolute;
                top: 20px;
                right: 30px;
                color: white;
                font-size: 35px;
                cursor: pointer;
            }

            .nav-arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: white;
                font-size: 50px;
                cursor: pointer;
                user-select: none;
                padding: 20px;
            }
            
            .left-arrow {
                left: 20px;
            }
            
            .right-arrow {
                right: 20px;
            }
            
            .nav-arrow:hover {
                opacity: 0.7;
            }
            
            /* Mobile */
            @media (max-width: 768px) {
                .popup-content {
                    flex-direction: column;
                }
            
                .popup-content img,
                .popup-text {
                    width: 100%;
                }
            }
        
    </style>
</head>
<body>

<!-- Header Section -->
<header>
    <a href="index.html" class="logo">JONATHAN HOANG NGUYEN</a>

    <div class="menu-toggle" id="menu-toggle">
        ☰
    </div>

    <div class="header-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="videoprojects.html">Videography</a>
        <a href="mumbai-photo-collection.html">Mumbai Collection</a>
        <a href="thailand-photo-collection.html">Thailand Collection</a>
    </div>
</header>

<!-- Main Content -->
<h1>Thailand Collection</h1>
<p>A collection of my favorite photos from Thailand.</p>

<div class="gallery">
    <img src="IMG_0315.JPG" alt="Two motorcycles in Thailand" class="left" loading="lazy" data-title="Descent From Hmong Doi Pui Village" data-description="Following a trip to the mountains, I captured these two motorcyclists">
    <img src="IMG_0314.JPG" alt="Rooftop scenery in Thailand" class="center" loading="lazy" data-title="Sunset Chiang Mai" data-description="A hazy photo following a day's walk around Chiang Mai">
    <img src="IMG_0304.JPG" alt="Pair of bikers in Thailand" class="right" loading="lazy" data-title="Bikers" data-description="McDonald's Everywhere">
</div>

<div class="gallery">
    <img src="IMG_0322.JPG" alt="Side profile of red car in Thailand" class="left" loading="lazy" data-title="Red" data-description="Ascending the mountain to the Hmong Doi Pui Village">
    <img src="IMG_0316.JPG" alt="Two guys in red in Thailand" class="center" loading="lazy" data-title="Reds" data-description="Two guys in red in Chiang Mai, Thailand at a nearby shopping center">
    <img src="IMG_0308.JPG" alt="Dog sleeping in Thailand" class="right" loading="lazy"data-title="Chiang Mai Doggo" data-description="Dog sleeping on top of a mountain temple">
</div>

<!-- New 2x2 Gallery -->
<div class="gallery-2x2">
    <img src="thailandphoto1.JPG" alt="Child getting photographed near river in Thailand" loading="lazy">
    <img src="thailandphoto2.JPG" alt="Fireworks over river in Thailand" loading="lazy">
    <img src="thailandphoto3.JPG" alt="Man hanging a light in Thailand" loading="lazy">
    <img src="thailandphoto4.JPG" alt="Two people sitting near river in Thailand" loading="lazy">
</div>

<!-- New three column Gallery -->
<div class="full-width-gallery">
    <img src="thailandphoto5.JPG" alt="Man sleeping on ground in Thailand" loading="lazy">
    <img src="thailandphoto6.JPG" alt="Man walking through market in Thailand" loading="lazy">
    <img src="thailandphoto7.JPG" alt="Girl standing in corridor in Thailand" loading="lazy">
</div>

<!-- Image Popup -->
<div id="imagePopup" class="popup">
    <span class="close">&times;</span>

    <span class="nav-arrow left-arrow">&#10094;</span>
    <span class="nav-arrow right-arrow">&#10095;</span>
    
    <div class="popup-content">
        <img id="popupImage" src="" alt="">
        <div class="popup-text">
            <h2 id="popupTitle"></h2>
            <p id="popupDescription"></p>
        </div>
    </div>
</div>

<!-- Footer -->
<footer>
    <p>Let's be friends</p>
    <ul>
        <li><a href="https://www.instagram.com/jayna__win/" target="_blank">Instagram</a></li>
        <li><a href="https://www.linkedin.com/in/jonathannguyens/" target="_blank">LinkedIn</a></li>
        <li><a href="https://www.youtube.com/@jayna_win" target="_blank">YouTube</a></li>
    </ul>
</footer>

<script>
    const toggle = document.getElementById("menu-toggle");
    const navLinks = document.getElementById("nav-links");

    toggle.addEventListener("click", function() {
        navLinks.classList.toggle("active");
    });

    const popup = document.getElementById("imagePopup");
    const popupImage = document.getElementById("popupImage");
    const popupTitle = document.getElementById("popupTitle");
    const popupDescription = document.getElementById("popupDescription");
    const closeBtn = document.querySelector(".close");

    const images = Array.from(
        document.querySelectorAll(
            ".gallery img, .gallery-2x2 img, .full-width-gallery img"
        )
    );

    let currentIndex = 0;

    function showImage(index) {
        const img = images[index];

        popupImage.src = img.src;
        popupTitle.textContent = img.dataset.title || "";
        popupDescription.textContent = img.dataset.description || "";

        currentIndex = index;
    }

    images.forEach((img, index) => {
        img.addEventListener("click", () => {
            popup.style.display = "block";
            showImage(index);
        });
    });

    document.querySelector(".left-arrow").addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage(currentIndex);
    });

    document.querySelector(".right-arrow").addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % images.length;
        showImage(currentIndex);
    });

    closeBtn.addEventListener("click", () => {
        popup.style.display = "none";
    });

    popup.addEventListener("click", (e) => {
        if (e.target === popup) {
            popup.style.display = "none";
        }
    });

    document.addEventListener("keydown", (e) => {
        if (popup.style.display !== "block") return;

        if (e.key === "ArrowLeft") {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage(currentIndex);
        }

        if (e.key === "ArrowRight") {
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        }

        if (e.key === "Escape") {
            popup.style.display = "none";
        }
    });
</script>
    
</body>
</html>
