<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbai Collection</title>

    <style>
        html, body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: white;
            color: black;
        }

        header a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        header a:hover {
            color: #A7C7E7;
        }

        .header-links {
            display: flex;
            gap: 20px;
        }

        .content {
            flex: 1;
            text-align: center;
            padding: 20px;
        }

        /* Gallery Layout */
        .gallery {
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .gallery img.left,
        .gallery img.right {
            width: 100%;
            height: 460px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        .gallery img.center {
            width: 100%;
            height: 460px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }

        .full-width-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            width: calc(100vw - 40px);
            margin: 0 auto;
        }

        .full-width-gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }

        .full-width-gallery img:hover {
            transform: scale(1.02);
        }

        /* FOOTER (CLEAN + CONSISTENT) */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            width: 100%;
            margin-top: auto;
        }

        footer p {
            margin: 0;
            font-size: 14px;
            color: white;
        }

        footer ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        footer ul li {
            display: inline-block;
            margin: 0 12px;
        }

        footer a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        footer a:hover {
            color: #A7C7E7;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .gallery,
            .full-width-gallery {
                grid-template-columns: 1fr;
            }

            .gallery img,
            .full-width-gallery img {
                height: auto;
                width: 100%;
                object-fit: contain;
            }

            .header-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: 20px;
                background: white;
                padding: 15px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }

            .header-links a {
                margin: 10px 0;
            }

            .header-links.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
                font-size: 2rem;
                cursor: pointer;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">JONATHAN HOANG NGUYEN</a>

    <div class="menu-toggle" id="menu-toggle">☰</div>

        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>

        <a href="thailand-photo-collection.html">Thailand Collection</a>
    </div>
</header>

<div class="content">

</body>
</html>
